repos:
  - repo: local
    hooks:
      - id: format
        name: format:check (prettier)
        entry: npm run format:check
        language: system
        pass_filenames: false
        always_run: true
      - id: lint
        name: lint (eslint)
        entry: npm run lint
        language: system
        pass_filenames: false
        always_run: true
      - id: typecheck
        name: typecheck (tsc)
        entry: npm run typecheck
        language: system
        pass_filenames: false
        always_run: true
      - id: test
        name: test (vitest)
        entry: npm run test
        language: system
        pass_filenames: false
        always_run: true
